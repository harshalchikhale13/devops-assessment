name: DevOps Assessment CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devops-assessment
  EKS_CLUSTER: devops-assessment
  K8S_NAMESPACE: default
  K8S_DEPLOYMENT: devops-assessment
  K8S_CONTAINER: app

jobs:
  test-build-deploy:
    name: Test, Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import os, sys; sys.path.insert(0, os.getcwd()); print('Workspace:', os.getcwd()); print('Python path:', sys.path); import app.main; print('App import successful')"
          python -m pytest -q
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::060516714598:role/github-actions-devops-assessment
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "IMAGE=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Deploy image to Kubernetes
        run: |
          kubectl set image \
            deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER=$IMAGE" \
            --namespace "$K8S_NAMESPACE"

          kubectl rollout status \
            deployment/"$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployment "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" -o wide
          kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -l app=devops-assessment
